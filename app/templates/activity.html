<ul class="settings-list">
    {% for event in activity %}
        <li class="row">
            <a href="{{ url_for('ui.record',e=event.id) }}">#{{ event.id }} · {{ 'Settings change' if event.kind=='configuration' else event.kind|replace('_',' ')|capitalize }}</a>
            <time>{{ event.day }}</time>
        </li>
    {% else %}
        <li>No entries yet.</li>
    {% endfor %}
</ul>
